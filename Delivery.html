    <style>
        #delivery {

            flex-direction: column;

            font-family: 'Bevan', Verdana, Geneva, Tahoma, sans-serif;

            display: flex;
            justify-content: center;

            height: 8px;
            
        }

        .circulo {
            background-color: lightpink;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .Ifood {
            height: 50%;
        }

        .Rappi {
            height: 50%;
        }
    </style>

<body>
    
    <section class="redondo">
        <div class="circulo"></div>
    </section>
    <section id="delivery">
        
        <a href="www.ifood.com.br" class="Ifood">
            <p>Ifood</p>
        </div>
        <a href="www.rappi.com.br" class="Rappi">
